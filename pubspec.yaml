# v1からの差分:
# - Dartコード実行用に dart_eval を追加

name: darteditor
description: iPad/Android/Webで使えるDartコードエディタ
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.0
  dart_eval: ^0.7.2

flutter:
  uses-material-design: true
