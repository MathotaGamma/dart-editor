# v4からの差分:
# - 等幅フォント JetBrainsMono を登録(assets/fonts/JetBrainsMono-Regular.ttf)
#   ※ファイルはワークフロー(dart_editor_build_v4.yml)がビルド時にダウンロードする

name: darteditor
description: iPad/Android/Webで使えるDartコードエディタ
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.0
  dart_eval: any
  flutter_eval: ^0.8.2

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
