# dart_editor_build_v3.yml からの差分:
# - dart_eval のバグ修正パッチを適用する手順を追加
#   (for の初期化で宣言した変数が、if の中の break で抜けたときにスタックへ残り、
#    その後の処理の値がずれる不具合。macros/branch.dart の後始末を修正する)

name: Build Dart Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          channel: stable
          cache: true

      - name: Create scaffold if missing
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.lupargent --project-name darteditor .
          fi

      - name: Set app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Dart Editor"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<title>.*</title>|<title>Dart Editor</title>|' web/index.html
          sed -i 's|content="darteditor"|content="Dart Editor"|' web/index.html

      - name: Install dependencies
        run: flutter pub get

      - name: Patch dart_eval (break leak)
        run: |
          python3 - <<'PY'
          import glob
          import os

          root = os.environ.get('PUB_CACHE') or os.path.expanduser('~/.pub-cache')
          files = glob.glob(os.path.join(
              root, 'hosted', 'pub.dev', 'dart_eval-*',
              'lib', 'src', 'eval', 'compiler', 'macros', 'branch.dart'))
          if not files:
              print('WARNING: dart_eval の branch.dart が見つからないため、パッチを適用していません')

          for p in files:
              s = open(p, encoding='utf-8').read()
              if 'PATCHED-BREAK-LEAK' in s:
                  print('already patched:', p)
                  continue
              then_old = '    //_ctx.endAllocScopeQuiet();\n'
              else_old = ('      ctx.endAllocScope();\n'
                          '      ctx.resolveBranchStateDiscontinuity(initialState);\n'
                          '      ctx.endAllocScope();\n'
                          '      return -1;\n')
              if then_old not in s or else_old not in s:
                  print('WARNING: 想定した形と違うため、パッチを適用していません:', p)
                  continue
              s = s.replace(then_old, '    ctx.endAllocScopeQuiet(); // PATCHED-BREAK-LEAK\n', 1)
              s = s.replace(else_old,
                            '      ctx.endAllocScopeQuiet();\n'
                            '      ctx.resolveBranchStateDiscontinuity(initialState);\n'
                            '      ctx.endAllocScopeQuiet();\n'
                            '      return -1;\n', 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('patched:', p)
          PY

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk darteditor-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" \
            "darteditor-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}"

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
